name: Set Closed date

on:
  pull_request:
    types: [closed]

jobs:
  set-closed-date:
    runs-on: ubuntu-latest

    steps:
      - name: Set Closed field
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Берём последний коммит PR
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            if (commits.length === 0) {
              core.setFailed("PR has no commits");
              return;
            }

            const lastCommit = commits[commits.length - 1];

            // Дата последнего коммита
            const date = new Date(
              lastCommit.commit.author.date
            );

            const closedDate = date.toLocaleDateString("en-US", {
              year: "numeric",
              month: "short",
              day: "numeric"
            });

            console.log(`Last commit: ${lastCommit.sha}`);
            console.log(`Closed date: ${closedDate}`);

            // Получаем твой Project #1
            const projectQuery = await github.graphql(`
              query($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2Field {
                          id
                          name
                        }
                      }
                    }
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on PullRequest {
                            id
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, {
              login: context.actor,
              number: 1
            });

            const project = projectQuery.user.projectV2;

            if (!project) {
              core.setFailed("Project #1 not found");
              return;
            }

            // Ищем поле Closed
            const closedField = project.fields.nodes.find(
              field => field.name === "Closed"
            );

            if (!closedField) {
              core.setFailed("Field 'Closed' not found");
              return;
            }

            // Ищем PR среди элементов Project
            const projectItem = project.items.nodes.find(
              item => item.content?.number === pr.number
            );

            if (!projectItem) {
              console.log("PR is not in Project #1");
              return;
            }

            // Записываем дату в текстовое поле Closed
            await github.graphql(`
              mutation(
                $projectId: ID!,
                $itemId: ID!,
                $fieldId: ID!,
                $value: ProjectV2FieldValue!
              ) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: $value
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `, {
              projectId: project.id,
              itemId: projectItem.id,
              fieldId: closedField.id,
              value: {
                text: closedDate
              }
            });

            console.log(`Closed field set to: ${closedDate}`);
